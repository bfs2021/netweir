[package]
name = "netweir-html"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast HTML parser that follows the WHATWG spec, written for Netweir."
repository = "https://github.com/netweir/html"
license = "AGPL-3.0-only"
publish = false

[dependencies]
memchr = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
